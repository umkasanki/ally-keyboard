name: Release

# Push a tag like v1.2.0 to cut a release:
#   git tag v1.2.0 && git push origin v1.2.0
# The job builds the app, packages a .dmg and a .zip, and publishes a GitHub
# Release with both — the two shapes every earlier release shipped.
#
# Ported from ally-clicker, with three differences that matter:
#   • this project builds with xcodebuild, not SwiftPM;
#   • the version lives in MARKETING_VERSION (GENERATE_INFOPLIST_FILE is YES),
#     so the tag is passed as a build setting rather than stamped into a plist;
#   • there is no Homebrew cask for the keyboard, so no tap to update.

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # GITHUB_TOKEN may create the release on this repo

jobs:
  release:
    runs-on: macos-latest
    env:
      # Optional stable self-signed identity. Without it the build is ad-hoc
      # signed, which works — but every release then has a different signature,
      # and macOS asks for the Accessibility grant again after each update. For
      # a user whose only way to type is this keyboard, that is not a small
      # thing: set both secrets when there is an identity to set.
      SIGNING_P12_BASE64: ${{ secrets.SIGNING_P12_BASE64 }}
      SIGNING_P12_PASSWORD: ${{ secrets.SIGNING_P12_PASSWORD }}
    steps:
      - uses: actions/checkout@v5

      - name: Derive version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Test core
        run: swift test
        working-directory: AllyKeyboardCore

      - name: Import stable signing identity
        if: env.SIGNING_P12_BASE64 != ''
        run: |
          KC="$HOME/Library/Keychains/allykeyboard.keychain-db"
          security create-keychain -p allykeyboard "$KC"
          security set-keychain-settings "$KC"          # no auto-lock
          security unlock-keychain -p allykeyboard "$KC"
          echo "$SIGNING_P12_BASE64" | base64 --decode > /tmp/signing.p12
          security import /tmp/signing.p12 -k "$KC" -P "$SIGNING_P12_PASSWORD" -A -T /usr/bin/codesign
          rm -f /tmp/signing.p12
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | sed 's/"//g')
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k allykeyboard "$KC" >/dev/null
          # NOT `find-identity -v -p codesigning`: `-v` keeps only identities
          # macOS considers *trusted*, and a self-signed certificate never is.
          # That flag silently produced an empty name in v1.2.0 and the release
          # went out ad-hoc signed.
          NAME="AllyKeyboard Self-Signed"
          if ! security find-identity "$KC" | grep -qF "$NAME"; then
            echo "::error::the identity '$NAME' is not in the keychain after import"
            security find-identity "$KC" | tail -5
            exit 1
          fi
          echo "Signing as: $NAME"
          echo "SIGN_IDENTITY=$NAME" >> "$GITHUB_ENV"
          echo "SIGN_KEYCHAIN=$KC" >> "$GITHUB_ENV"

      - name: Build
        run: |
          set -euo pipefail
          IDENTITY="${SIGN_IDENTITY:--}"        # "-" is ad-hoc, the fallback
          # An `if`, not `[ … ] && …`: under `set -e` a false test is a failed
          # command and the step would end here, silently, having built nothing.
          KEYCHAIN_FLAG=""
          if [ -n "${SIGN_KEYCHAIN:-}" ]; then
            KEYCHAIN_FLAG="OTHER_CODE_SIGN_FLAGS=--keychain ${SIGN_KEYCHAIN}"
          fi
          xcodebuild \
            -project AllyKeyboard/AllyKeyboard.xcodeproj \
            -scheme AllyKeyboard \
            -configuration Release \
            -derivedDataPath build \
            MARKETING_VERSION=${{ steps.ver.outputs.version }} \
            CODE_SIGN_IDENTITY="$IDENTITY" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM= \
            ${KEYCHAIN_FLAG:+"$KEYCHAIN_FLAG"} \
            build
          # Say what came out, and refuse to publish an ad-hoc build when an
          # identity was supposed to be used. A release that is quietly signed
          # with nothing costs the user their Accessibility grant, and nothing
          # in the log would have said so.
          codesign -dv --verbose=2 build/Build/Products/Release/AllyKeyboard.app 2>&1 | grep -E 'Authority|Signature|Identifier=' || true
          if [ "$IDENTITY" != "-" ]; then
            codesign -dv --verbose=2 build/Build/Products/Release/AllyKeyboard.app 2>&1 \
              | grep -qF "Authority=$IDENTITY" || {
                echo "::error::asked to sign as '$IDENTITY' but the app is not signed with it"
                exit 1
              }
          fi

      - name: Package
        run: |
          set -euo pipefail
          V=${{ steps.ver.outputs.version }}
          APP=build/Build/Products/Release/AllyKeyboard.app
          mkdir -p dist/stage
          cp -R "$APP" dist/stage/
          ln -s /Applications dist/stage/Applications
          hdiutil create -volname "AllyKeyboard" -srcfolder dist/stage \
                         -ov -format UDZO "dist/AllyKeyboard-$V.dmg"
          ditto -c -k --keepParent "$APP" "dist/AllyKeyboard-$V.zip"
          ls -lh dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=${{ steps.ver.outputs.version }}
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "AllyKeyboard $V" \
            --generate-notes \
            "dist/AllyKeyboard-$V.dmg" "dist/AllyKeyboard-$V.zip"
